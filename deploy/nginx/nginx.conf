worker_processes auto;
worker_rlimit_nofile 65535;
thread_pool io_pool threads=32 max_queue=65536;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include /usr/local/openresty/nginx/conf/mime.types;
  default_type application/octet-stream;

  # Trust Cloudflare IP ranges so $remote_addr is the real visitor IP.
  # Source: https://www.cloudflare.com/ips/
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  set_real_ip_from 127.0.0.1;   # cloudflared tunnel on same host
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /usr/local/openresty/nginx/logs/access.log main;
  error_log  /usr/local/openresty/nginx/logs/error.log  warn;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript
             application/xml+rss image/svg+xml font/woff2;

  # WebSocket upgrade support — used by the Connection proxy header below.
  map $http_upgrade $connection_upgrade {
    default   keep-alive;
    websocket Upgrade;
  }

  # Forward the protocol Cloudflare saw (https), not the tunnel protocol (http).
  # Falls back to $scheme when the header is absent (direct / non-CF access).
  map $http_x_forwarded_proto $real_scheme {
    default  $scheme;
    "~."     $http_x_forwarded_proto;
  }

  include /etc/nginx/conf.d/*.conf;
  include /etc/nginx/managed/*.conf;
}
