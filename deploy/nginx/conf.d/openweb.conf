upstream api_upstream {
  zone      api_zone 64k;
  server    api:3000;
  keepalive 16;
  keepalive_requests 1000;
  keepalive_timeout  30s;   # close idle connections after 30 s
}

upstream web_upstream {
  zone      web_zone 64k;
  server    web:80;
  keepalive 16;
  keepalive_requests 1000;
  keepalive_timeout  30s;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 50m;

  # ── Timeouts ────────────────────────────────────────────────────────────
  proxy_connect_timeout  10s;
  proxy_send_timeout     60s;
  proxy_read_timeout     60s;

  # ── Retry on 502 / connection errors ────────────────────────────────────
  # Automatically retries the request when nginx gets a bad gateway from
  # the upstream, which happens when a keepalive connection goes stale.
  proxy_next_upstream error timeout http_502 http_503;
  proxy_next_upstream_tries    3;
  proxy_next_upstream_timeout  10s;

  # ── Buffering ───────────────────────────────────────────────────────────
  # Prevent nginx from blocking the upstream while slowly sending data to
  # the client (Cloudflared). Avoids 502 on large API responses.
  proxy_buffering          on;
  proxy_buffer_size        16k;
  proxy_buffers            8 16k;
  proxy_busy_buffers_size  32k;

  # ── Common proxy headers (applied to every location) ────────────────────
  # X-Forwarded-Proto: Cloudflare always delivers HTTPS to end-users, but
  # cloudflared connects to this nginx over plain HTTP.  We forward the
  # proto Cloudflare originally saw, falling back to $scheme.
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $real_scheme;

  # Upgrade/Connection pair: allows WebSocket pass-through.
  # For normal HTTP requests the map resolves Connection to "keep-alive"
  # (maintaining upstream keepalive); for WS upgrades it becomes "Upgrade".
  proxy_set_header Upgrade    $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  proxy_http_version 1.1;

  # ── Routes ──────────────────────────────────────────────────────────────

  location /api/ {
    proxy_pass http://api_upstream;
  }

  # Vite build output — filenames include a content hash (e.g. index-a1b2c3.js)
  # so the URL changes whenever the file changes.  Safe to cache for 1 year.
  location /assets/ {
    proxy_pass http://web_upstream;
    more_set_headers "Cache-Control: public, max-age=31536000, immutable";
  }

  # User-uploaded media — no content hash, but changes are infrequent.
  # 7-day browser cache; ETags from the API allow conditional revalidation.
  location /uploads/ {
    proxy_pass http://api_upstream;
    more_set_headers "Cache-Control: public, max-age=604800";
  }

  # Let's Encrypt HTTP-01 challenge files
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location = /health {
    proxy_pass http://api_upstream;
    # Skip buffering for health checks — they must respond fast.
    proxy_buffering off;
  }

  location = /robots.txt {
    proxy_pass http://api_upstream;
  }

  location = /sitemap.xml {
    proxy_pass http://api_upstream;
  }

  # Route admin and system views directly to the Web SPA
  location ~ ^/(admin|login|setup|register|portal) {
    proxy_pass http://web_upstream;
    more_set_headers "Cache-Control: no-cache";
  }

  # Route all other visitor/root views through the API container for SSR Caching
  location / {
    proxy_pass http://api_upstream;
    more_set_headers "Cache-Control: no-cache";
  }
}
