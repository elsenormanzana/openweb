services:
  proxy:
    image: openresty/openresty:1.27.1.2-alpine
    ports:
      - target: 80
        published: ${PUBLIC_HTTP_PORT:-80}
        protocol: tcp
        mode: ingress
      - target: 443
        published: ${PUBLIC_HTTPS_PORT:-843}
        protocol: tcp
        mode: ingress
    volumes:
      - nginx_managed:/etc/nginx/managed
      - letsencrypt_www:/var/www/certbot
      - letsencrypt_etc:/etc/letsencrypt
    configs:
      - source: nginx_conf
        target: /usr/local/openresty/nginx/conf/nginx.conf
      - source: nginx_site_conf
        target: /etc/nginx/conf.d/openweb.conf

    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first

  web:
    image: openweb-web:latest
    environment:
      NODE_ENV: production
      PORT: 80
      API_URL: http://api:3000
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first

  api:
    image: openweb-api:latest
    environment:
      PORT: 3000
      WEB_PURGE_URL: http://web:80/__purge
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-openweb}
      POSTGRES_USER: ${POSTGRES_USER:-openweb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openweb}

      JWT_SECRET: ${JWT_SECRET:-change_me}
      LETSENCRYPT_LIVE_DIR: /etc/letsencrypt/live
      LETSENCRYPT_WEBROOT: /var/www/certbot
      LETSENCRYPT_CERTBOT_BIN: certbot
      CERTBOT_COMMAND: docker ps -q --filter label=com.docker.swarm.service.name=${STACK_NAME:-openweb}_certbot | head -n1 | xargs -r -I{} docker exec {} certbot
      NGINX_MANAGED_CONFIG_PATH: /app/nginx-managed/openweb-ssl.conf
      SSL_AUTO_RENEW_ENABLED: ${SSL_AUTO_RENEW_ENABLED:-true}
      SSL_AUTO_RENEW_INTERVAL_HOURS: ${SSL_AUTO_RENEW_INTERVAL_HOURS:-12}
      OPENWEB_BASE_DOMAIN: ${OPENWEB_BASE_DOMAIN:-}
      NGINX_VALIDATE_COMMAND: docker ps -q --filter label=com.docker.swarm.service.name=${STACK_NAME:-openweb}_proxy | head -n1 | xargs -r -I{} docker exec {} nginx -t
      NGINX_RELOAD_COMMAND: docker ps -q --filter label=com.docker.swarm.service.name=${STACK_NAME:-openweb}_proxy | head -n1 | xargs -r -I{} docker exec {} nginx -s reload
    volumes:
      - uploads_data:/app/apps/api/uploads
      - backups_data:/app/apps/api/backups
      - nginx_managed:/app/nginx-managed
      - letsencrypt_www:/var/www/certbot
      - letsencrypt_etc:/etc/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openweb}
      POSTGRES_USER: ${POSTGRES_USER:-openweb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openweb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure



  autoscaler:
    image: openweb-autoscaler:latest
    environment:
      STACK_NAME: ${STACK_NAME:-openweb}
      API_SERVICE_BASENAME: api
      WEB_SERVICE_BASENAME: web
      API_MIN_REPLICAS: ${API_MIN_REPLICAS:-2}
      API_MAX_REPLICAS: ${API_MAX_REPLICAS:-10}
      WEB_MIN_REPLICAS: ${WEB_MIN_REPLICAS:-2}
      WEB_MAX_REPLICAS: ${WEB_MAX_REPLICAS:-10}
      SCALE_UP_CPU: ${SCALE_UP_CPU:-70}
      SCALE_DOWN_CPU: ${SCALE_DOWN_CPU:-25}
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-30}
      COOLDOWN_SECONDS: ${COOLDOWN_SECONDS:-120}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  certbot:
    image: certbot/certbot:latest
    volumes:
      - letsencrypt_www:/var/www/certbot
      - letsencrypt_etc:/etc/letsencrypt
    entrypoint: ["sh", "-c"]
    command: ["trap exit TERM INT; while :; do sleep 3600; done"]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  postgres_data:

  uploads_data:
  backups_data:
  nginx_managed:
  letsencrypt_www:
  letsencrypt_etc:

configs:
  nginx_conf:
    file: ./nginx/nginx.conf
  nginx_site_conf:
    file: ./nginx/conf.d/openweb.conf

