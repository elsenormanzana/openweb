services:
  proxy:
    image: openresty/openresty:1.27.1.2-alpine
    depends_on:
      - web
      - api
    ports:
      - "${PUBLIC_HTTP_PORT:-802}:80"
      - "${PUBLIC_HTTPS_PORT:-843}:443"
    volumes:
      - ./nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_managed:/etc/nginx/managed
      - letsencrypt_www:/var/www/certbot
      - letsencrypt_etc:/etc/letsencrypt
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-openweb}
      POSTGRES_USER: ${POSTGRES_USER:-openweb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openweb}
      JWT_SECRET: ${JWT_SECRET:-change_me}
      LETSENCRYPT_LIVE_DIR: /etc/letsencrypt/live
      LETSENCRYPT_WEBROOT: /var/www/certbot
      LETSENCRYPT_CERTBOT_BIN: certbot
      CERTBOT_COMMAND: docker ps -q --filter label=com.docker.compose.service=certbot | head -n1 | xargs -r -I{} docker exec {} certbot
      NGINX_MANAGED_CONFIG_PATH: /app/nginx-managed/openweb-ssl.conf
      SSL_AUTO_RENEW_ENABLED: ${SSL_AUTO_RENEW_ENABLED:-true}
      SSL_AUTO_RENEW_INTERVAL_HOURS: ${SSL_AUTO_RENEW_INTERVAL_HOURS:-12}
      OPENWEB_BASE_DOMAIN: ${OPENWEB_BASE_DOMAIN:-}
      NGINX_VALIDATE_COMMAND: docker ps -q --filter label=com.docker.compose.service=proxy | head -n1 | xargs -r -I{} docker exec {} nginx -t
      NGINX_RELOAD_COMMAND: docker ps -q --filter label=com.docker.compose.service=proxy | head -n1 | xargs -r -I{} docker exec {} nginx -s reload
    depends_on:
      - postgres
    volumes:
      - uploads_data:/app/apps/api/uploads
      - backups_data:/app/apps/api/backups
      - nginx_managed:/app/nginx-managed
      - letsencrypt_www:/var/www/certbot
      - letsencrypt_etc:/etc/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - letsencrypt_www:/var/www/certbot
      - letsencrypt_etc:/etc/letsencrypt
    entrypoint: ["sh", "-c"]
    command: ["trap exit TERM INT; while :; do sleep 3600; done"]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openweb}
      POSTGRES_USER: ${POSTGRES_USER:-openweb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openweb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  backups_data:
  nginx_managed:
  letsencrypt_www:
  letsencrypt_etc:
